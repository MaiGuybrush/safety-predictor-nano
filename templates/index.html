<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argus // System Config</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #0a0a0a;
            --text: #00ff41; /* Terminal Green */
            --text-dim: #008f11;
            --border: #003b00;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            margin: 0;
            padding: clamp(1rem, 3vw, 3rem);
            text-transform: uppercase;
            line-height: 1.4;
            /* Scanline effect */
            background-image: linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px);
            background-size: 100% 3px;
        }
        .sys-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .blink {
            width: 12px; height: 12px;
            background: var(--text);
            margin-right: 15px;
            animation: blink 1.2s step-end infinite;
            box-shadow: 0 0 10px var(--text);
        }
        @keyframes blink { 50% { opacity: 0; } }
        h1 {
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            margin: 0;
            letter-spacing: 2px;
        }
        .sys-core {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            align-items: start;
        }
        @media (min-width: 900px) {
            .sys-core { grid-template-columns: 350px 1fr; }
            .sys-core.hide-config { grid-template-columns: 1fr; }
        }
        .sys-core.hide-config #config-panel { display: none; }

        .panel {
            border: 1px solid var(--border);
            background: var(--panel);
            padding: 1.5rem;
            position: relative;
        }
        .panel::before {
            content: attr(data-title);
            position: absolute;
            top: -0.6rem; left: 1rem;
            background: var(--bg);
            padding: 0 0.5rem;
            font-size: 0.8rem;
            color: var(--text-dim);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
            margin-top: 0.5rem;
        }
        .field { display: flex; flex-direction: column; }
        label {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 0.3rem;
        }
        input, select, textarea {
            box-sizing: border-box;
            width: 100%;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--text);
            background: rgba(0, 255, 65, 0.05);
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.2) inset;
        }
        textarea { resize: vertical; min-height: 80px; }
        
        .btn-exec {
            margin-top: 1.5rem;
            width: 100%;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--text);
            padding: 1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 2px;
            transition: all 0.1s;
        }
        .btn-exec:hover {
            background: var(--text);
            color: var(--bg);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }
        .btn-exec:active { transform: scale(0.98); }
        
        .feed-container {
            border: 1px solid var(--border);
            position: relative;
            padding: 4px;
            background: var(--panel);
        }
        .feed-header {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            font-size: 0.75rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-dim);
        }
        .feed-header span.live { color: var(--text); animation: blink 2s infinite; }
        .cam-feed {
            width: 100%;
            display: block;
            cursor: pointer;
        }
        .stream-selector-bar {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .stream-btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.3rem 0.6rem;
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .stream-btn:hover {
            background: var(--text);
            color: var(--bg);
        }
        .model-status-bar {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            background: var(--panel);
            font-size: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .status-label { color: var(--text-dim); }
        .status-value { color: var(--text); font-weight: bold; }
        .status-sep   { color: var(--border); }

        /* Fullscreen Modal Styles */
        .fullscreen-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(5, 5, 5, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
        }
        .modal-header {
            position: absolute;
            top: 1rem; left: 1.5rem; right: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            z-index: 10000;
        }
        .modal-close-btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--text);
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .modal-close-btn:hover {
            background: var(--text);
            color: var(--bg);
        }
        .modal-body {
            position: relative;
            max-width: 95vw;
            max-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #fullscreen-img {
            max-width: 95vw;
            max-height: 85vh;
            object-fit: contain;
            display: block;
            border: 1px solid var(--border);
        }
        #fullscreen-canvas {
            position: absolute;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <header class="sys-header">
        <div style="display: flex; align-items: center;">
            <div class="blink"></div>
            <h1>ARGUS // PREDICTOR_NANO</h1>
        </div>
        <button type="button" class="btn-exec" style="margin:0; width:auto; padding: 0.5rem 1rem;" onclick="document.getElementById('sys-core').classList.toggle('hide-config')">[ TOGGLE_CONFIG ]</button>
    </header>

    <div class="model-status-bar" id="model-status-bar">
        <span class="status-label">MODEL_BACKEND</span>
        <span class="status-value" id="model-type">---</span>
        <span class="status-sep">//</span>
        <span class="status-label">PATH</span>
        <span class="status-value" id="model-path">---</span>
        <span class="status-sep">//</span>
        <span class="status-label">CPU_CORES</span>
        <span class="status-value" id="model-cores">---</span>
        <span class="status-sep">//</span>
        <button type="button" class="stream-btn" onclick="syncModels()">[ SYNC_MODELS ]</button>
        <span class="status-value" id="sync-status">---</span>
    </div>

    <main class="sys-core" id="sys-core">
        <form method="POST" class="panel" id="config-panel" data-title="SYS_CONFIG_PARAMETERS">
            <div class="form-grid">
                <div class="field">
                    <label>運作模式 (MODE)</label>
                    <select name="mode">
                        <option value="rtsp" {% if config.get('mode', 'rtsp') == 'rtsp' %}selected{% endif %}>RTSP 多路模式</option>
                        <option value="video" {% if config.get('mode', 'rtsp') == 'video' %}selected{% endif %}>影片驗證模式</option>
                    </select>
                </div>
                <div class="field">
                    <label>模型路徑 (MODEL_PATH)</label>
                    <input type="text" name="model_path" value="{{ config.model_path }}">
                </div>
                <div class="field">
                    <label>影片路徑 (VIDEO_PATH)</label>
                    <input type="text" name="video_path" value="{{ config.get('video_path', '') }}">
                </div>
                <div class="field">
                    <label>信心度門檻 (CONF_THRESHOLD)</label>
                    <input type="number" name="conf_threshold" value="{{ config.get('conf_threshold', 0.25) }}" step="0.01" min="0.01" max="1.0">
                </div>
                <div class="field">
                    <label>RTSP 串流 (STREAMS)</label>
                    <textarea name="rtsp_streams">{{ '\n'.join(config.rtsp_streams) }}</textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="field">
                        <label>FPS 限制</label>
                        <input type="number" name="fps_limit" value="{{ config.fps_limit }}">
                    </div>
                    <div class="field">
                        <label>CPU 核心數</label>
                        <input type="number" name="cpu_cores" value="{{ config.cpu_cores }}">
                    </div>
                </div>
                <div class="field">
                    <label>日誌寫入間隔 (LOG_INTERVAL_SEC)</label>
                    <input type="number" name="log_interval_seconds" value="{{ config.log_interval_seconds }}">
                </div>
                <div class="field">
                    <label>效能日誌 (LOG_FILE)</label>
                    <input type="text" name="log_file" value="{{ config.log_file }}">
                </div>
                <div class="field">
                    <label>偵測日誌 (DETECTION_LOG)</label>
                    <input type="text" name="detection_log_file" value="{{ config.detection_log_file }}">
                </div>
            </div>
            <button type="submit" class="btn-exec">[ EXECUTE_UPDATE ]</button>
        </form>

        <aside class="feed-container">
            <div class="feed-header">
                <span>SIGNAL: DETECT_LINK_OK</span>
                <span class="live">● LIVE_INFERENCE</span>
            </div>
            <img src="/video_feed" class="cam-feed" alt="Video Feed" onclick="openFullscreen(0)">
            <div class="stream-selector-bar">
                {% for idx in range(config.get('rtsp_streams', [])|length) %}
                    <button type="button" class="stream-btn" onclick="openFullscreen({{ idx }})">[ STREAM #{{ idx }} ]</button>
                {% endfor %}
            </div>
        </aside>
    </main>

    <!-- Fullscreen Modal Overlay -->
    <div id="fullscreen-modal" class="fullscreen-modal" style="display:none;" onclick="closeFullscreenOnBackdrop(event)">
        <div class="modal-header">
            <div style="display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;">
                <div class="blink"></div>
                <span id="modal-title">FULLSCREEN_STREAM // STREAM #0</span>
                <span id="zone-status-badge" style="color: #888888; font-size: 0.75rem;">[ ZONE: INACTIVE ]</span>
            </div>
            <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                <div id="zone-view-controls">
                    <button type="button" class="stream-btn" id="btn-edit-zone" onclick="enterZoneEditMode()">[ 編輯區域 EDIT_ZONE ]</button>
                </div>
                <div id="zone-edit-controls" style="display: none; align-items: center; gap: 0.5rem;">
                    <input type="text" id="zone-name-input" placeholder="ZONE_NAME" style="width: 130px; padding: 0.3rem 0.5rem; font-size: 0.75rem; border: 1px solid #00e5ff; color: #00e5ff; background: rgba(0,0,0,0.5);">
                    <button type="button" class="stream-btn" onclick="closeZonePolygon()" style="border-color: #00e5ff; color: #00e5ff;">[ 封閉 CLOSE ]</button>
                    <button type="button" class="stream-btn" onclick="clearZonePoints()" style="border-color: #ffaa00; color: #ffaa00;">[ 清除 CLEAR ]</button>
                    <button type="button" class="stream-btn" onclick="saveZone()" style="border-color: #00ff41; color: #00ff41;">[ 儲存 SAVE ]</button>
                    <button type="button" class="stream-btn" onclick="cancelZoneEdit()" style="border-color: #ff3333; color: #ff3333;">[ 取消 CANCEL ]</button>
                </div>
                <button type="button" class="modal-close-btn" onclick="closeFullscreen()">[ EXIT_FULLSCREEN ✕ ]</button>
            </div>
        </div>
        <div class="modal-body" onclick="event.stopPropagation()">
            <img id="fullscreen-img" alt="Stream Feed">
            <canvas id="fullscreen-canvas"></canvas>
        </div>
    </div>

    <script>
        const CONFIG_MODE = {{ config.get('mode', 'rtsp') | tojson }};
        const CONFIG_STREAMS = {{ config.get('rtsp_streams', []) | tojson }};
        const CONFIG_VIDEO_PATH = {{ config.get('video_path', '') | tojson }};

        function refreshModelInfo() {
            fetch('/model_info')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('model-type').textContent = data.type || '---';
                    document.getElementById('model-path').textContent = data.path || '---';
                    document.getElementById('model-cores').textContent = data.cpu_cores || '---';
                })
                .catch(err => console.error('Error fetching model info:', err));
        }
        refreshModelInfo();
        setInterval(refreshModelInfo, 5000);

        function refreshSyncStatus() {
            fetch('/sync_status')
                .then(r => r.json())
                .then(data => {
                    const el = document.getElementById('sync-status');
                    if (!data.timestamp) { el.textContent = '---'; return; }
                    el.textContent = `OK:${data.success.length} FAIL:${data.failed.length}`;
                })
                .catch(err => console.error('Error fetching sync status:', err));
        }
        refreshSyncStatus();
        setInterval(refreshSyncStatus, 5000);

        function syncModels() {
            const el = document.getElementById('sync-status');
            el.textContent = 'SYNCING...';
            fetch('/sync_models', {method: 'POST'})
                .then(r => r.json())
                .then(data => {
                    el.textContent = `OK:${data.success.length} FAIL:${data.failed.length}`;
                })
                .catch(err => {
                    el.textContent = 'ERROR';
                    console.error('Error syncing models:', err);
                });
        }

        let activeStreamIndex = null;
        let activeStreamUrl = null;
        let eventSource = null;
        let latestDetectionsMap = {};
        let canvasAnimTimer = null;

        let isEditingZone = false;
        let editingPolygon = [];
        let isPolygonClosed = false;
        let currentSavedZone = null;
        let mousePos = null;

        function getStreamUrlByIndex(idx) {
            if (latestDetectionsMap[idx] && latestDetectionsMap[idx].stream_url) {
                return latestDetectionsMap[idx].stream_url;
            }
            if (latestDetectionsMap[String(idx)] && latestDetectionsMap[String(idx)].stream_url) {
                return latestDetectionsMap[String(idx)].stream_url;
            }
            if (CONFIG_MODE === 'video') {
                return CONFIG_VIDEO_PATH;
            }
            if (Array.isArray(CONFIG_STREAMS) && idx >= 0 && idx < CONFIG_STREAMS.length) {
                return CONFIG_STREAMS[idx];
            }
            return '';
        }

        function updateZoneBadge() {
            const badge = document.getElementById('zone-status-badge');
            if (!badge) return;
            if (currentSavedZone && currentSavedZone.polygon && currentSavedZone.polygon.length >= 3) {
                const name = currentSavedZone.zone_name ? ` (${currentSavedZone.zone_name})` : '';
                badge.textContent = `[ ZONE: ACTIVE${name} ]`;
                badge.style.color = '#00e5ff';
            } else {
                badge.textContent = '[ ZONE: INACTIVE ]';
                badge.style.color = '#888888';
            }
        }

        function loadStreamZone(url) {
            currentSavedZone = null;
            updateZoneBadge();
            if (!url) return;
            fetch('/zone/' + encodeURIComponent(url))
                .then(r => r.json())
                .then(data => {
                    if (data && data.polygon && data.polygon.length >= 3) {
                        currentSavedZone = data;
                    } else {
                        currentSavedZone = null;
                    }
                    updateZoneBadge();
                    drawCanvas();
                })
                .catch(err => {
                    console.error('Error fetching zone:', err);
                });
        }

        function startSSE() {
            if (eventSource) return;
            eventSource = new EventSource('/detections_feed');
            eventSource.onmessage = function(e) {
                try {
                    latestDetectionsMap = JSON.parse(e.data);
                    if (activeStreamIndex !== null) {
                        if (!activeStreamUrl) {
                            activeStreamUrl = getStreamUrlByIndex(activeStreamIndex);
                            if (activeStreamUrl && !currentSavedZone && !isEditingZone) {
                                loadStreamZone(activeStreamUrl);
                            }
                        }
                        drawCanvas();
                    }
                } catch(err) {
                    console.error('Error parsing SSE detections:', err);
                }
            };
            eventSource.onerror = function(err) {
                console.error('SSE connection error:', err);
            };
        }

        function openFullscreen(streamId) {
            activeStreamIndex = streamId;
            activeStreamUrl = getStreamUrlByIndex(streamId);

            const modal = document.getElementById('fullscreen-modal');
            const img = document.getElementById('fullscreen-img');
            const title = document.getElementById('modal-title');

            title.textContent = `FULLSCREEN_STREAM // STREAM #${streamId}`;
            img.src = `/video_feed/${streamId}?t=` + Date.now();
            modal.style.display = 'flex';

            loadStreamZone(activeStreamUrl);
            startSSE();

            img.onload = function() {
                syncCanvasSize();
                drawCanvas();
            };

            if (canvasAnimTimer) clearInterval(canvasAnimTimer);
            canvasAnimTimer = setInterval(() => {
                if (activeStreamIndex !== null) {
                    drawCanvas();
                }
            }, 100);
        }

        function closeFullscreen() {
            if (isEditingZone) {
                exitZoneEditMode();
            }
            activeStreamIndex = null;
            activeStreamUrl = null;
            currentSavedZone = null;

            if (canvasAnimTimer) {
                clearInterval(canvasAnimTimer);
                canvasAnimTimer = null;
            }
            const modal = document.getElementById('fullscreen-modal');
            const img = document.getElementById('fullscreen-img');
            modal.style.display = 'none';
            img.src = '';
            const canvas = document.getElementById('fullscreen-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function closeFullscreenOnBackdrop(event) {
            if (isEditingZone) return;
            closeFullscreen();
        }

        function syncCanvasSize() {
            const img = document.getElementById('fullscreen-img');
            const canvas = document.getElementById('fullscreen-canvas');
            if (!img || !canvas) return;

            canvas.width = img.clientWidth;
            canvas.height = img.clientHeight;
            canvas.style.width = img.clientWidth + 'px';
            canvas.style.height = img.clientHeight + 'px';
            canvas.style.left = img.offsetLeft + 'px';
            canvas.style.top = img.offsetTop + 'px';
        }

        function enterZoneEditMode() {
            isEditingZone = true;
            isPolygonClosed = !!(currentSavedZone && currentSavedZone.polygon && currentSavedZone.polygon.length >= 3);
            editingPolygon = (currentSavedZone && currentSavedZone.polygon) ? JSON.parse(JSON.stringify(currentSavedZone.polygon)) : [];
            document.getElementById('zone-name-input').value = (currentSavedZone && currentSavedZone.zone_name) || '';
            document.getElementById('zone-view-controls').style.display = 'none';
            document.getElementById('zone-edit-controls').style.display = 'flex';
            const canvas = document.getElementById('fullscreen-canvas');
            if (canvas) {
                canvas.style.pointerEvents = 'auto';
                canvas.style.cursor = 'crosshair';
            }
            drawCanvas();
        }

        function closeZonePolygon() {
            if (editingPolygon.length >= 3) {
                isPolygonClosed = true;
                mousePos = null;
                drawCanvas();
            }
        }

        function clearZonePoints() {
            editingPolygon = [];
            isPolygonClosed = false;
            mousePos = null;
            drawCanvas();
        }

        function saveZone() {
            const url = activeStreamUrl || getStreamUrlByIndex(activeStreamIndex);
            if (!url) {
                alert('No active stream URL found');
                return;
            }
            const name = document.getElementById('zone-name-input').value.trim();
            const polyToSend = (editingPolygon.length >= 3) ? editingPolygon : [];
            fetch('/zone/' + encodeURIComponent(url), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    polygon: polyToSend,
                    zone_name: polyToSend.length >= 3 ? (name || null) : null
                })
            })
            .then(r => r.json())
            .then(data => {
                currentSavedZone = (data && data.zone && data.zone.polygon && data.zone.polygon.length >= 3) ? data.zone : null;
                exitZoneEditMode();
            })
            .catch(err => {
                console.error('Error saving zone:', err);
                alert('Failed to save zone');
            });
        }

        function cancelZoneEdit() {
            exitZoneEditMode();
        }

        function exitZoneEditMode() {
            isEditingZone = false;
            editingPolygon = [];
            mousePos = null;
            document.getElementById('zone-view-controls').style.display = 'block';
            document.getElementById('zone-edit-controls').style.display = 'none';
            const canvas = document.getElementById('fullscreen-canvas');
            if (canvas) {
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }
            updateZoneBadge();
            drawCanvas();
        }

        const fsCanvas = document.getElementById('fullscreen-canvas');
        fsCanvas.addEventListener('click', (e) => {
            if (!isEditingZone) return;
            const rect = fsCanvas.getBoundingClientRect();
            const normX = (e.clientX - rect.left) / fsCanvas.width;
            const normY = (e.clientY - rect.top) / fsCanvas.height;
            const clampedX = Math.max(0, Math.min(1, normX));
            const clampedY = Math.max(0, Math.min(1, normY));

            if (editingPolygon.length >= 3 && !isPolygonClosed) {
                const firstPt = editingPolygon[0];
                const dx = (clampedX - firstPt[0]) * fsCanvas.width;
                const dy = (clampedY - firstPt[1]) * fsCanvas.height;
                if (Math.hypot(dx, dy) < 18) {
                    closeZonePolygon();
                    return;
                }
            }

            if (!isPolygonClosed) {
                editingPolygon.push([clampedX, clampedY]);
                drawCanvas();
            }
        });

        fsCanvas.addEventListener('mousemove', (e) => {
            if (!isEditingZone || isPolygonClosed || editingPolygon.length === 0) return;
            const rect = fsCanvas.getBoundingClientRect();
            const normX = (e.clientX - rect.left) / fsCanvas.width;
            const normY = (e.clientY - rect.top) / fsCanvas.height;
            mousePos = [Math.max(0, Math.min(1, normX)), Math.max(0, Math.min(1, normY))];
            drawCanvas();
        });

        function drawPolygon(ctx, poly, isClosed, isEdit, zoneName) {
            if (!poly || poly.length === 0) return;
            const w = ctx.canvas.width;
            const h = ctx.canvas.height;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(poly[0][0] * w, poly[0][1] * h);
            for (let i = 1; i < poly.length; i++) {
                ctx.lineTo(poly[i][0] * w, poly[i][1] * h);
            }
            if (isClosed) {
                ctx.closePath();
                ctx.fillStyle = 'rgba(0, 229, 255, 0.15)';
                ctx.fill();
                ctx.strokeStyle = '#00e5ff';
                ctx.setLineDash([]);
            } else {
                ctx.strokeStyle = '#00e5ff';
                ctx.setLineDash([6, 4]);
            }
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw vertex dots
            ctx.setLineDash([]);
            poly.forEach((pt, idx) => {
                ctx.beginPath();
                ctx.arc(pt[0] * w, pt[1] * h, isEdit ? 5 : 3, 0, 2 * Math.PI);
                ctx.fillStyle = (isEdit && idx === 0 && !isClosed) ? '#ff0055' : '#00e5ff';
                ctx.fill();
                ctx.strokeStyle = '#050505';
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            // Draw Zone label tag
            if (isClosed && poly.length >= 3) {
                const label = zoneName ? `[ ROI: ${zoneName} ]` : '[ ROI: ACTIVE ]';
                ctx.font = '12px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace';
                const textWidth = ctx.measureText(label).width;
                const tagX = poly[0][0] * w;
                const tagY = Math.max(poly[0][1] * h - 10, 16);

                ctx.fillStyle = 'rgba(0, 30, 40, 0.85)';
                ctx.fillRect(tagX, tagY - 14, textWidth + 8, 18);
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 1;
                ctx.strokeRect(tagX, tagY - 14, textWidth + 8, 18);

                ctx.fillStyle = '#00e5ff';
                ctx.fillText(label, tagX + 4, tagY);
            }

            ctx.restore();
        }

        function drawCanvas() {
            if (activeStreamIndex === null) return;
            const img = document.getElementById('fullscreen-img');
            const canvas = document.getElementById('fullscreen-canvas');
            if (!img || !canvas) return;

            syncCanvasSize();

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw zone (either in edit mode or saved zone)
            if (isEditingZone) {
                drawPolygon(ctx, editingPolygon, isPolygonClosed, true, document.getElementById('zone-name-input').value.trim());
                if (!isPolygonClosed && mousePos && editingPolygon.length > 0) {
                    const lastPt = editingPolygon[editingPolygon.length - 1];
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(lastPt[0] * canvas.width, lastPt[1] * canvas.height);
                    ctx.lineTo(mousePos[0] * canvas.width, mousePos[1] * canvas.height);
                    ctx.strokeStyle = 'rgba(0, 229, 255, 0.6)';
                    ctx.setLineDash([4, 4]);
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.restore();
                }
            } else if (currentSavedZone && currentSavedZone.polygon && currentSavedZone.polygon.length >= 3) {
                drawPolygon(ctx, currentSavedZone.polygon, true, false, currentSavedZone.zone_name);
            }

            const detObj = latestDetectionsMap[activeStreamIndex] || latestDetectionsMap[String(activeStreamIndex)];
            if (!detObj || !detObj.detections || !detObj.frame_w || !detObj.frame_h) return;

            const nowSec = Date.now() / 1000.0;
            const detTs = detObj.ts || 0;
            const age = nowSec - detTs;
            const isStale = (age > 0.15);

            const scaleX = canvas.width / detObj.frame_w;
            const scaleY = canvas.height / detObj.frame_h;

            detObj.detections.forEach(det => {
                const coords = det.xyxy || [];
                if (coords.length >= 4) {
                    const x1 = coords[0] * scaleX;
                    const y1 = coords[1] * scaleY;
                    const w = (coords[2] - coords[0]) * scaleX;
                    const h = (coords[3] - coords[1]) * scaleY;

                    // Set line style for stale / sampled indicator
                    if (isStale) {
                        ctx.setLineDash([5, 5]);
                        ctx.strokeStyle = 'rgba(0, 255, 65, 0.75)';
                    } else {
                        ctx.setLineDash([]);
                        ctx.strokeStyle = '#00ff41';
                    }
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x1, y1, w, h);

                    ctx.setLineDash([]);

                    // Draw label
                    const tag = isStale ? ' [SAMPLED]' : '';
                    const labelText = `Class ${det.cls} (${(det.conf * 100).toFixed(0)}%)${tag}`;
                    ctx.font = '13px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace';
                    const textWidth = ctx.measureText(labelText).width;
                    
                    ctx.fillStyle = isStale ? 'rgba(0, 40, 0, 0.9)' : 'rgba(0, 59, 0, 0.85)';
                    ctx.fillRect(x1, Math.max(y1 - 20, 0), textWidth + 8, 20);

                    ctx.fillStyle = isStale ? '#85ffaa' : '#00ff41';
                    ctx.fillText(labelText, x1 + 4, Math.max(y1 - 5, 14));
                }
            });
        }

        window.addEventListener('resize', () => {
            if (activeStreamIndex !== null) {
                syncCanvasSize();
                drawCanvas();
            }
        });
    </script>
</body>
</html>
