ffmpeg:
  bin: ffmpeg

# 強制 WebRTC 使用固定 Port (解決防火牆問題)
webrtc:
  listen: ":8655"       # WebRTC 訊號/數據 Port

rtsp:
  listen: ":8654"

api:
  listen: ":2084"       # 管理介面 Port
