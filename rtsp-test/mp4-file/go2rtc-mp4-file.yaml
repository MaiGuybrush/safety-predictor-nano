  # -stream_loop -1 代表無限循環播放
  fake_camera:
    # 原始設定（未縮放，保留供回復）
    # - "exec:ffmpeg -re -stream_loop -1 -fflags +genpts -i \"D:/Projects/argus/safty-predictor-nano/00__Video_20240505102430_000_CLOSE.avi\" -vf yadif=0:-1:0 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 4000k -maxrate 4000k -bufsize 8000k -g 30 -keyint_min 15 -sc_threshold 0 -c:a aac -b:a 128k -f rtsp -rtsp_transport tcp {output}"
